server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
          filters:
            - AuthenticationFilter
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics

gateway:
  security:
    demo-token: demo-token

---

spring:
  config:
    activate:
      on-profile: demo
  cloud:
    discovery:
      enabled: false
    gateway:
      routes:
        - id: order-service-demo
          uri: forward:/__gateway-demo/orders
          predicates:
            - Path=/api/orders/**
          filters:
            - AuthenticationFilter
        - id: product-service-demo
          uri: forward:/__gateway-demo/products
          predicates:
            - Path=/api/products/**
          filters:
            - AuthenticationFilter
        - id: user-service-demo
          uri: forward:/__gateway-demo/users
          predicates:
            - Path=/api/users/**

eureka:
  client:
    enabled: false

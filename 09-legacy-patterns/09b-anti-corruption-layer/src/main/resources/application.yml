server:
  port: 9002

spring:
  application:
    name: anti-corruption-layer
  datasource:
    url: jdbc:h2:mem:acldb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

# ACL configuration
acl:
  # Legacy system SOAP endpoint
  legacy-system-url: http://legacy-erp.internal:8080/LegacyOrderService
  # Translation model: legacy concept → our domain concept
  field-mapping:
    orderNumber: orderId
    clientCode: customerId
    unitCount: quantity
    itemRef: productId

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.micarch.acl: DEBUG

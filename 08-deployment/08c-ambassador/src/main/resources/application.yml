server:
  port: 8803

spring:
  application:
    name: ambassador-proxy

# Ambassador proxy configuration
# Translates modern REST calls → legacy SOAP/XML API
ambassador:
  legacy-soap-url: http://legacy-erp.internal:8080/ws
  connect-timeout: 5000
  read-timeout: 10000

resilience4j:
  circuitbreaker:
    instances:
      legacySystem:
        slidingWindowSize: 5
        failureRateThreshold: 60
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
  retry:
    instances:
      legacySystem:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.micarch.ambassador: DEBUG

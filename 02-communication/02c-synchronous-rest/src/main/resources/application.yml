server:
  port: 8202

spring:
  application:
    name: sync-rest-order-service
  datasource:
    url: jdbc:h2:mem:syncorders
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# OpenFeign configuration
feign:
  client:
    config:
      inventory-service:
        connect-timeout: 2000
        read-timeout: 5000
        logger-level: FULL
  compression:
    request:
      enabled: true
    response:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.micarch.rest: DEBUG
    feign: DEBUG

server:
  port: 8102

spring:
  application:
    name: strangler-fig
  cloud:
    gateway:
      routes:
        # NEW: Migrated /api/orders/** → new Order microservice
        - id: orders-new
          uri: ${strangler.routes.new-service-uri:http://localhost:8101}
          predicates:
            - Path=/api/orders/**
          filters:
            - RewritePath=/api/orders(?<segment>/?.*), /__strangler/new/orders${segment}

        # LEGACY: Unmigrated API traffic still goes to the monolith
        - id: monolith-fallback
          uri: ${strangler.routes.legacy-service-uri:http://localhost:9001}
          predicates:
            - Path=/api/**
          filters:
            - RewritePath=/api(?<segment>/?.*), /__strangler/legacy${segment}

strangler:
  routes:
    new-service-uri: http://localhost:8101
    legacy-service-uri: http://localhost:9001

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

---

# The demo profile keeps both downstreams in this application so the routing
# behavior can be exercised without starting a separate monolith and service.
spring:
  config:
    activate:
      on-profile: demo

  cloud:
    gateway:
      routes:
        # Forward routes use fixed in-process targets in the demo profile.
        # Production routes above use external services plus RewritePath.
        - id: orders-new-demo
          uri: forward:/__strangler/new/orders
          predicates:
            - Path=/api/orders
        - id: monolith-fallback-demo
          uri: forward:/__strangler/legacy
          predicates:
            - Path=/api/**

strangler:
  routes:
    new-service-uri: forward:/__strangler/new
    legacy-service-uri: forward:/__strangler/legacy

server:
  port: 8201

spring:
  application:
    name: bff-mobile
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
    loadbalancer:
      ribbon:
        enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Downstream service URLs (used when Eureka not available in dev)
services:
  order-service-url: http://localhost:8101
  inventory-service-url: http://localhost:8301
  payment-service-url: http://localhost:8401

logging:
  level:
    com.micarch.bff: DEBUG

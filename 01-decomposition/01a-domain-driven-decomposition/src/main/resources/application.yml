server:
  port: 8101
  error:
    include-message: always

spring:
  application:
    name: ddd-ecommerce-service

  # ── PostgreSQL ──────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5433/ddd_ecommerce
    username: ddd
    password: ddd
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Kafka ───────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      group-id: ddd-ecommerce
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.micarch.ddd.*
        spring.json.use.type.headers: true

# ── Actuator ────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ── Swagger / OpenAPI ───────────────────────────────────────────────
ddd:
  payment:
    # Simulated payment success probability. Override with 0.0 or 1.0 for deterministic flows.
    success-rate: 0.9

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

# ── Logging ─────────────────────────────────────────────────────────
logging:
  level:
    com.micarch: DEBUG

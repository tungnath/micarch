server:
  port: 8301

spring:
  application:
    name: database-per-service

  # --- PostgreSQL for Order context ---
  datasource:
    url: jdbc:postgresql://localhost:5432/orders_db
    username: micarch
    password: micarch
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-if-not-exists
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # --- MongoDB for Product Catalog context ---
  data:
    mongodb:
      host: localhost
      port: 27017
      database: products_db
      username: micarch
      password: micarch
      authentication-database: admin

  # --- Redis for Session/Cart context ---
  redis:
    host: localhost
    port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.micarch.dbperservice: DEBUG

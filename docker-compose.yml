version: '3.9'

services:

  # ─────────────────────────── MESSAGING ────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: micarch-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks: [micarch]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: micarch-kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [micarch]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: micarch-kafka-ui
    depends_on: [kafka]
    ports:
      - "9093:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks: [micarch]

  # ─────────────────────────── DATABASES ────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: micarch-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: micarch
      POSTGRES_PASSWORD: micarch
      POSTGRES_DB: micarch
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: [micarch]

  mongodb:
    image: mongo:7.0
    container_name: micarch-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: micarch
      MONGO_INITDB_ROOT_PASSWORD: micarch
    volumes:
      - mongo_data:/data/db
    networks: [micarch]

  redis:
    image: redis:7.2-alpine
    container_name: micarch-redis
    ports:
      - "6379:6379"
    networks: [micarch]

  # ─────────────────────────── EVENT STORE ──────────────────────────
  axonserver:
    image: axoniq/axonserver:2024.1.0
    container_name: micarch-axonserver
    ports:
      - "8024:8024"  # UI
      - "8124:8124"  # gRPC
    volumes:
      - axon_data:/axonserver/data
      - axon_events:/axonserver/events
    networks: [micarch]

  # ─────────────────────────── TRACING ──────────────────────────────
  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: micarch-zipkin
    ports:
      - "9411:9411"
    networks: [micarch]

  # ─────────────────────────── SECURITY ─────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: micarch-keycloak
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks: [micarch]

  # ─────────────────────────── OBSERVABILITY ────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: micarch-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks: [micarch]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.0
    container_name: micarch-kibana
    depends_on: [elasticsearch]
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks: [micarch]

  logstash:
    image: docker.elastic.co/logstash/logstash:8.14.0
    container_name: micarch-logstash
    depends_on: [elasticsearch]
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
    volumes:
      - ./infra/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    networks: [micarch]

  # ─────────────────────────── ADMIN UI ─────────────────────────────
  spring-boot-admin:
    image: slydeveloper/spring-boot-admin:latest
    container_name: micarch-admin
    ports:
      - "9090:1111"
    networks: [micarch]

networks:
  micarch:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  axon_data:
  axon_events:
  es_data:
